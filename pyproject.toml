[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qed-engine"
version = "0.1.0"
description = "QED-Engine 统一配置中心：集中管理模型/API-key，向 Axiom-Flow 与 QED-Tracker 提供配置接口"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.110.0",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.0.0",
  "uvicorn[standard]>=0.27.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.0",
  "pytest>=8.0.0",
  "ruff>=0.5.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[project.scripts]
qed = "qed_engine.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["qed_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --import-mode=importlib"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
